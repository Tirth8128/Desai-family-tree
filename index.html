    if(up===1&&dn===2){const sg=pm[bP[1]]?.gender;return sg==="male"?(m?"Nephew / ભત્રીજો":"Niece / ભત્રીજી"):(m?"Nephew / ભાણેજ":"Niece / ભાણી");}
    if(up===2&&dn===2){const pg=pm[aP[1]]?.gender;return pg==="male"?(m?"Cousin / પિતરાઈ ભાઈ":"Cousin / પિતરાઈ બહેન"):(m?"Cousin / મામેરો ભાઈ":"Cousin / મામેરી બહેન");}
    if(up===3&&dn===1)return m?"Grand Uncle / મોટા દાદા":"Grand Aunt / મોટી દાદી";
    if(up===3&&dn===2){const pg=pm[aP[1]]?.gender;return pg==="male"?(m?"Father's Cousin / કાકા":"Father's Cousin / ફોઈ"):(m?"Mother's Cousin / મામા":"Mother's Cousin / માસી");}
    if(up===3&&dn===3)return m?"Second Cousin / દૂરના ભાઈ":"Second Cousin / દૂરની બહેન";
    if(up===1&&dn===3)return m?"Grand Nephew / ભત્રીજાનો દીકરો":"Grand Niece / ભત્રીજાની દીકરી";
    if(up===2&&dn===3)return m?"Cousin's Son / પિતરાઈનો દીકરો":"Cousin's Daughter / પિતરાઈની દીકરી";
    if(up===4&&dn===2)return m?"Grandfather's Cousin / દાદા":"Grandmother's Cousin / દાદી";
    if(up===4&&dn===3)return m?"Father's Second Cousin / કાકા":"Father's Second Cousin / ફોઈ";

    return m?"Relative / સગો":"Relative / સગી";
  }
  function sL(up,dn,aP,rg){
    if(up===1&&dn===0)return m?"Father / પિતા":"Mother / માતા";
    if(up===2&&dn===0){const pg=pm[aP[1]]?.gender;return pg==="male"?(m?"Grandfather / દાદા":"Grandmother / દાદી"):(m?"Grandfather / નાના":"Grandmother / નાની");}
    if(up===3&&dn===0)return m?"Great Grandfather / વડદાદા":"Great Grandmother / વડદાદી";
    if(up===1&&dn===1)return m?"Brother-in-law / બનેવી":"Sister-in-law / ભાભી";
    if(up===2&&dn===1){const pg=pm[aP[1]]?.gender;if(pg==="male")return m?"Uncle / ફુઆ":"Aunt / કાકી";return m?"Uncle / માસા":"Aunt / મામી";}
    if(up===3&&dn===1)return m?"Grand Uncle / મોટા દાદા":"Grand Aunt / મોટી દાદી";
    if(up===3&&dn===2){const pg=pm[aP[1]]?.gender;return pg==="male"?(m?"Father's Cousin's Spouse / ફુઆ":"Father's Cousin's Spouse / કાકી"):(m?"Mother's Cousin's Spouse / માસા":"Mother's Cousin's Spouse / મામી");}
    if(up===0&&dn===1)return m?"Son-in-law / જમાઈ":"Daughter-in-law / વહુ";
    if(up===0&&dn===2)return m?"Grandson-in-law / પૌત્ર જમાઈ":"Granddaughter-in-law / પૌત્રવધૂ";
    if(up===1&&dn===2)return m?"Nephew-in-law / ભત્રીજા જમાઈ":"Niece-in-law / ભત્રીજી વહુ";
    if(up===2&&dn===2)return m?"Cousin-in-law / પિતરાઈ":"Cousin-in-law / પિતરાઈ";
    if(up===2&&dn===3)return m?"Cousin's Son-in-law / જમાઈ":"Cousin's Daughter-in-law / વહુ";
    if(up===4&&dn===2)return m?"Grandfather's Cousin's Spouse / દાદા":"Grandmother's Cousin's Spouse / દાદી";

  }
  if(pm[meId].spouseId===targetId)return m?"Husband / પતિ":"Wife / પત્ની";
  let spOf=null;

      if(up===1&&down===2)return m?"Nephew / ભત્રીજો":"Niece / ભત્રીજી";

          if(up===0&&down===1)return m?"Son-in-law / જમાઈ":"Daughter-in-law / વહુ";
          return m?"In-law / સગો":"In-law / સગી";

}

const byB=(a,b)=>(parseInt(a.birthYear)||99999)-(parseInt(b.birthYear)||99999);
function buildTree(people){
  const m={};people.forEach(p=>m[p.id]=p);
  const kbp={};people.forEach(p=>{if(p.parentId){if(!kbp[p.parentId])kbp[p.parentId]=[];kbp[p.parentId].push(p);}});
  function gk(pid,sid){const s=new Set(),o=[];[pid,sid].forEach(id=>{if(!id)return;(kbp[id]||[]).forEach(c=>{if(!s.has(c.id)){s.add(c.id);o.push(c);}});});return o.sort(byB);}
  const done=new Set();
  function build(id){if(done.has(id))return null;const p=m[id];if(!p)return null;done.add(id);const sid=p.spouseId&&m[p.spouseId]&&!done.has(p.spouseId)?p.spouseId:null;if(sid)done.add(sid);return{primary:p,spouse:sid?m[sid]:null,children:gk(id,sid).map(k=>build(k.id)).filter(Boolean)};}
  const noP=people.filter(p=>!p.parentId).sort(byB),skip=new Set(),rIds=[];
  noP.forEach(p=>{if(skip.has(p.id))return;if(p.spouseId&&m[p.spouseId]&&!m[p.spouseId].parentId){const pk=(kbp[p.id]||[]).length,sk=(kbp[p.spouseId]||[]).length;if(pk>=sk){rIds.push(p.id);skip.add(p.spouseId);}else{rIds.push(p.spouseId);skip.add(p.id);}}else rIds.push(p.id);});
  return rIds.map(id=>build(id)).filter(Boolean);
}

      {view!=="home"&&<button onClick={()=>{setView("home");setSearch("")}} style={{background:C.warm,border:`1.5px solid ${C.brd}`,borderRadius:10,padding:"8px 12px",fontSize:14,fontWeight:600,color:C.acc}}>{t.back}</button>}
      <div style={{flex:1,minWidth:90}}>
        <h1 style={{fontFamily:"'Merriweather',Georgia,serif",fontSize:18,fontWeight:700,margin:0,color:C.acc}}>🌳 {t.title}</h1>
        <p style={{margin:0,fontSize:11,color:C.txtL}}>{DATA.length} {t.members}</p>
      </div>
      <button onClick={()=>{setMePicker(true);setMeSearch("")}} style={{padding:"6px 10px",borderRadius:8,border:`2px solid ${C.meB}`,background:C.meH,color:C.meB,fontSize:11,fontWeight:700,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>👤 {pm[meId]?.name?.split(" ")[0]||t.iAm}</button>
      <button onClick={()=>setLang(l=>l==="en"?"gu":"en")} style={{padding:"6px 10px",borderRadius:8,border:`2px solid ${C.acc}`,background:C.accBg,color:C.acc,fontSize:12,fontWeight:700}}>{t.lang}</button>
    </header>

    {mePicker&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>meId&&setMePicker(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.w,borderRadius:16,padding:18,width:"100%",maxWidth:400,maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
        <h2 style={{fontFamily:"'Merriweather',serif",fontSize:19,fontWeight:700,color:C.acc,margin:"0 0 4px"}}>{t.who}</h2>
        <p style={{fontSize:13,color:C.txtM,margin:"0 0 10px"}}>{t.whoHint}</p>
        <input value={meSearch} onChange={e=>setMeSearch(e.target.value)} placeholder={t.search} style={{width:"100%",padding:"11px 14px",fontSize:15,borderRadius:12,border:`2px solid ${C.brd}`,outline:"none",marginBottom:10,boxSizing:"border-box"}}/>
        <div style={{flex:1,overflowY:"auto"}}>
          {meCands.map(p=><button key={p.id} onClick={()=>{setMeId(p.id);setMePicker(false)}} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"9px 11px",borderRadius:10,border:`2px solid ${isMe(p.id)?C.meB:C.brd}`,background:isMe(p.id)?C.meH:C.w,cursor:"pointer",textAlign:"left",marginBottom:5}}><Av n={p.name} g={p.gender} s={38}/><div style={{flex:1}}><div style={{fontSize:15,fontWeight:600}}>{p.name}</div></div>{isMe(p.id)&&<span style={{color:C.meB,fontWeight:700}}>👤</span>}</button>)}
        </div>
      </div>
    </div>}

    {view==="vt"&&<div style={{position:"fixed",top:56,left:0,right:0,bottom:0,background:C.bg,overflow:"hidden"}}>
      <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",zIndex:50,display:"flex",gap:6,background:C.w,borderRadius:12,padding:6,boxShadow:`0 3px 14px ${C.shdD}`,border:`1px solid ${C.brd}`}}>
        <button onClick={()=>setZoom(z=>Math.min(3,z+.12))} style={zb}>+</button>
        <button onClick={()=>setZoom(z=>Math.max(.05,z-.12))} style={zb}>−</button>
        <button onClick={fitV} style={{...zb,width:"auto",padding:"0 14px",fontSize:13}}>{t.fit}</button>
      </div>
      <p style={{position:"absolute",bottom:56,left:"50%",transform:"translateX(-50%)",fontSize:11,color:C.txtL,whiteSpace:"nowrap",zIndex:50}}>{t.zoom}</p>
      <div ref={cr} onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU} onWheel={onWh} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE} style={{width:"100%",height:"100%",cursor:drag?"grabbing":"grab",touchAction:"none"}}>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}><g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
          {L.lines.map((l,i)=><line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={C.line} strokeWidth={2} strokeLinecap="round"/>)}
          {L.sL.map((l,i)=><line key={`s${i}`} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={C.spL} strokeWidth={2.5} strokeDasharray="5,4"/>)}
        </g></svg>
        <div style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,transformOrigin:"0 0",position:"absolute",top:0,left:0}}>
          {Object.entries(L.pos).map(([id,p])=>{const person=pm[id];if(!person)return null;const me=isMe(id);const r=rel(id);return(
            <div key={id} className="vn" onClick={e=>{e.stopPropagation();openP(id)}} style={{position:"absolute",left:p.x,top:p.y,width:NW,height:NH,background:me?C.meH:C.nodeBg,border:`2px solid ${me?C.meB:C.brd}`,borderTop:`3px solid ${gc(person.gender)}`,borderRadius:10,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:3,boxShadow:me?`0 0 12px ${C.meB}44`:`0 2px 6px ${C.shd}`}}>
              <Av n={person.name} g={person.gender} s={28} mini/>
              <div style={{fontSize:9,fontWeight:600,marginTop:2,textAlign:"center",lineHeight:1.1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",width:"100%",padding:"0 2px",boxSizing:"border-box"}}>{person.name.split(" ")[0]}</div>
              {r&&<div style={{fontSize:7.5,color:me?C.meB:C.txtL,marginTop:1,textAlign:"center",fontWeight:me?700:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",width:"100%",padding:"0 2px",boxSizing:"border-box"}}>{r}</div>}
            </div>)})}
        </div>
      </div>
    </div>}

    <div style={{maxWidth:700,margin:"0 auto",padding:"0 14px 60px",display:view==="vt"?"none":"block"}}>
      {view==="home"&&<>
        {meId&&pm[meId]&&<div onClick={()=>{setMePicker(true);setMeSearch("")}} style={{background:C.meH,border:`2px solid ${C.meB}`,borderRadius:12,padding:"10px 14px",margin:"12px 0 10px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
          <Av n={pm[meId].name} g={pm[meId].gender} s={34}/>
          <div style={{flex:1}}><div style={{fontSize:13,color:C.meB,fontWeight:600}}>{t.viewAs}: <strong>{pm[meId].name}</strong></div><div style={{fontSize:11,color:C.txtM}}>{t.change}</div></div>
          <span>✏️</span>
        </div>}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.search} style={{width:"100%",padding:"12px 16px",fontSize:15,borderRadius:14,border:`2px solid ${C.brd}`,background:C.w,outline:"none",boxSizing:"border-box",marginBottom:10}}/>
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <button onClick={()=>setMode("grid")} style={{...tb,background:mode==="grid"?C.accBg:C.w,borderColor:mode==="grid"?C.acc:C.brd,color:mode==="grid"?C.acc:C.txtM}}>{t.everyone}</button>
          <button onClick={()=>setMode("list")} style={{...tb,background:mode==="list"?C.accBg:C.w,borderColor:mode==="list"?C.acc:C.brd,color:mode==="list"?C.acc:C.txtM}}>{t.list}</button>
          <button onClick={()=>{setView("vt");setTimeout(fitV,200)}} style={{...tb,background:C.w,borderColor:C.brd,color:C.txtM}}>{t.tree}</button>
        </div>
        {mode==="grid"&&sorted.map(p=><PRow key={p.id} p={p} onClick={()=>openP(p.id)} r={rel(p.id)} me={isMe(p.id)}/>)}
        {mode==="list"&&trees.map((n,i)=><TN key={i} node={n} openP={openP} d={0} rel={rel} meId={meId}/>)}
        {filtered.length===0&&<div style={{textAlign:"center",padding:40,color:C.txtL}}>{t.noRes} "{search}"</div>}
      </>}

      {view==="person"&&sel&&<div style={{padding:"18px 0"}}>
        <div style={{textAlign:"center",marginBottom:18}}>
          <Av n={sel.name} g={sel.gender} s={110}/>
          <h2 style={{fontFamily:"'Merriweather',serif",fontSize:22,fontWeight:700,margin:"12px 0 4px"}}>{sel.name}{isMe(sel.id)?" 👤":""}</h2>
          {rel(sel.id)&&<p style={{fontSize:16,color:C.meB,margin:0,fontWeight:600}}>{rel(sel.id)}</p>}
        </div>
        <div style={{background:C.w,borderRadius:14,border:`1.5px solid ${C.brd}`,overflow:"hidden"}}>
          <div style={{padding:"10px 16px",background:C.warm,fontWeight:600,fontSize:15,color:C.acc}}>{t.conn}</div>
          {sel.parentId&&pm[sel.parentId]&&<RRow p={pm[sel.parentId]} onClick={()=>openP(sel.parentId)} r={rel(sel.parentId)}/>}
          {sel.spouseId&&pm[sel.spouseId]&&<RRow p={pm[sel.spouseId]} onClick={()=>openP(sel.spouseId)} r={rel(sel.spouseId)}/>}
          {ck(sel.id).map(c=><RRow key={c.id} p={c} onClick={()=>openP(c.id)} r={rel(c.id)}/>)}
          {sel.parentId&&DATA.filter(p=>p.parentId===sel.parentId&&p.id!==sel.id).map(s=><RRow key={s.id} p={s} onClick={()=>openP(s.id)} r={rel(s.id)}/>)}
        </div>
      </div>}
    </div>
    <div style={{textAlign:"center",padding:"16px 0 30px",fontSize:11,color:C.txtL,display:view==="vt"?"none":"block"}}>Made with ❤️ for the Desai family</div>
  </div>;
}

const tb={flex:1,padding:"10px 4px",borderRadius:10,border:"2px solid",fontSize:12,fontWeight:600,cursor:"pointer",background:"#fff"};
const zb={width:34,height:34,borderRadius:8,border:`1.5px solid ${C.brd}`,background:C.w,color:C.txt,cursor:"pointer",fontSize:17,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
